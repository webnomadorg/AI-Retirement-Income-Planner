<!-- Google Analytics + Meta Pixel — on every page (visible here in the source).
     Consent starts DENIED, except for a visitor who has ALREADY accepted: their saved
     choice is read synchronously right here, BEFORE gtag('config') sends the page_view.
     ⚠ This has to happen in <head> and nowhere else. consent.js is deferred, so until
     2026-08-31 it restored a saved 'granted' AFTER the page_view had already gone out as
     gcs=G100 (consent denied) — and gtag never re-sends a page_view. Every pageview by
     every visitor, consenting or not, was reported as a cookieless denied ping, which GA4
     only turns back into users through behavioural modelling this site is far too small to
     qualify for. Measured that day: GA4 saw roughly a quarter of the traffic the cookieless
     Vercel Web Analytics did. The Meta pixel never had this bug — fbq QUEUES events while
     revoked and flushes them on grant, which is why Facebook's numbers looked right and
     Google's did not. Keep this block byte-identical across every page; page_build.py
     propagates it from partials/head-analytics.html and --check flags any page left behind. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6VX12DHPY3"></script>
<script>
  window.wnConsent = (function () {
    try { return localStorage.getItem('wn-consent') === 'granted' ? 'granted' : 'denied'; }
    catch (e) { return 'denied'; }
  })();
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    ad_storage: window.wnConsent,
    ad_user_data: window.wnConsent,
    ad_personalization: window.wnConsent,
    analytics_storage: window.wnConsent
  });
  gtag('js', new Date());
  gtag('config', 'G-6VX12DHPY3');
</script>
<!-- Meta Pixel. Revoked BEFORE init unless the visitor already accepted (Meta requires that
     order); while revoked fbq queues events and flushes them when consent.js grants. -->
<script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window,document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  if (window.wnConsent !== 'granted') fbq('consent', 'revoke');
  fbq('init', '2106222783607307');
  fbq('track', 'PageView');
</script>
