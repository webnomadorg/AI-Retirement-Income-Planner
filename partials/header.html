<header class="site-header">
  <div class="container nav">

    </a>
    <!-- Outside .nav-panel on purpose. The panel collapses into the hamburger below 1500px, so a
         search button inside it would be invisible on every laptop and phone — buried under two
         taps. Here it sits beside the hamburger and stays reachable at every width. -->
    <button class="nav-search" id="navSearch" aria-label="Search the site" aria-haspopup="dialog" aria-expanded="false" title="Search (Ctrl+K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="nav-toggle" aria-label="Open menu" aria-controls="nav-panel" aria-expanded="false"><span></span></button>
    <div class="nav-panel" id="nav-panel">
      <ul class="nav-links">
        <li><a href="/"{{CUR_HOME}}>Home</a></li>
        <li><a href="/products.html"{{CUR_PRODUCTS}}>Products</a></li>
        <li><a href="/features.html"{{CUR_FEATURES}}>Features</a></li>
        <li><a href="/how-it-works.html"{{CUR_HOW}}>How It Works</a></li>
        <li><a href="/getting-started.html"{{CUR_START}}>Getting Started</a></li>

        <li><a href="/blog.html"{{CUR_BLOG}}>Blog</a></li>
        <li><a href="/faq.html"{{CUR_FAQ}}>FAQ</a></li>
      </ul>
      <div class="nav-theme">
        <button class="dark-toggle" id="darkToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <select class="theme-select" id="themeSelect" aria-label="Choose colour theme">
          <option value="">Quiet Fintech</option>
          <option value="soft">Soft Consumer</option>
          <option value="editorial">Editorial</option>
          <option value="pro">Pro Dashboard</option>
          <option value="contrast">High Contrast</option>
        </select>
      </div>
      <div class="nav-cta">
        <a class="btn btn-primary btn-sm" href="/products.html" aria-label="Buy the planner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Buy now</a>
      </div>
    </div>
  </div>
  <!-- Sale bar. Empty until assets/js/sale.js fills it from /api/sale, so a promotion can start
       and stop with no deploy.

       ⚠ It must live INSIDE the site-header element. page_build.py rewrites pages by matching
       that element with a non-greedy regex, so anything below the closing tag would not
       propagate and would show as permanent --check drift. For the same reason, never write
       that closing tag anywhere in here — not even inside a comment like this one. The regex
       stops at the first one it sees, which truncates the header it writes into all 90 pages
       and leaves the remainder loose in the body. Nothing errors; the check even goes green
       again on the next run, because the first match is clean and the wreckage sits after it. -->
  <div id="saleBar" class="sale-bar" hidden></div>
  <!-- Reserve the 30px before first paint, exactly as the theme snippet in <head> restores dark
       mode before first paint, and for the same reason: sale.js is deferred, so without this the
       bar would arrive after the page had already been drawn and shove the hero down under the
       reader's eyes. This only decides WHETHER to make room; sale.js remains the single source
       of what the bar actually says. -->
  <script>try{var s=JSON.parse(sessionStorage.getItem('wn-sale')||'null');if(s&&s.active&&s.id!==localStorage.getItem('wn-sale-dismissed')&&Date.parse(s.endsAt)>Date.now()){document.documentElement.classList.add('has-sale');document.getElementById('saleBar').hidden=false}}catch(e){}</script>
</header>
